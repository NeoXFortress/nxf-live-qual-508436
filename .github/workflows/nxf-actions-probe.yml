name: nxf-actions-probe
on:
  push:
    branches: [actions-probe]
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Attempt to update protected release with GITHUB_TOKEN (must be refused)
        run: git push origin origin/main:refs/heads/release
